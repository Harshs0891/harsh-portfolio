<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Obsidian Background with subtle rounded architectural corners -->
  <rect width="512" height="512" rx="112" fill="#090A0F" />
  
  <!-- Exposed 1px Structural Border Frame -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#1E2330" stroke-width="8" />

  <!-- Telemetry Accent Dot (Top Right) -->
  <circle cx="390" cy="122" r="12" fill="#10B981" />

  <!-- Monogram & Terminal Bracket ("H" + ">") -->
  <g transform="translate(110, 110)">
    <!-- Left Stem of H -->
    <rect x="40" y="40" width="36" height="212" rx="6" fill="#F3F4F6" />
    <!-- Right Stem of H -->
    <rect x="194" y="40" width="36" height="212" rx="6" fill="#F3F4F6" />
    <!-- Center Bar of H with Electric Cobalt Gradient -->
    <rect x="76" y="128" width="118" height="36" rx="4" fill="#3B82F6" />
    
    <!-- Architectural / Terminal Bracket Arrow '>' overlapping the right stem -->
    <path d="M 238 96 L 278 146 L 238 196" fill="none" stroke="#06B6D4" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>